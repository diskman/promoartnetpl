---
layout: default
---

<article class="reading-shell py-8">
  <header class="mb-12">
    <h1 class="text-4xl font-extrabold text-gray-900 mb-4">{{ page.title }}</h1>
    <p class="text-lg text-gray-500 italic">{{ page.description }}</p>
    <div class="mt-4 flex items-center text-sm text-gray-400">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
    </div>
  </header>

  <div class="prose lg:prose-xl max-w-none mb-16 text-gray-700">
    {{ content }}
  </div>

  {% if page.gallery %}
  <!-- Lightbox / Carousel Component using Alpine.js -->
  <section class="mt-16 pt-16 border-t border-gray-100" 
           x-data="{ 
             isOpen: false, 
             activeIndex: 0, 
             images: [
               {% for item in page.gallery %}
               { url: '{{ item.image | relative_url }}', caption: '{{ item.caption }}' }{% unless forloop.last %},{% endunless %}
               {% endfor %}
             ],
             open(index) {
               this.activeIndex = index;
               this.isOpen = true;
               document.body.style.overflow = 'hidden';
             },
             close() {
               this.isOpen = false;
               document.body.style.overflow = 'auto';
             },
             next() {
               this.activeIndex = (this.activeIndex + 1) % this.images.length;
             },
             prev() {
               this.activeIndex = (this.activeIndex - 1 + this.images.length) % this.images.length;
             }
           }"
           @keydown.escape.window="isOpen && close()"
           @keydown.right.window="isOpen && next()"
           @keydown.left.window="isOpen && prev()">
    
    <h2 class="text-3xl font-bold text-gray-900 mb-8">Galeria</h2>
    
    <!-- Thumbnail Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      {% for item in page.gallery %}
      <div class="group relative overflow-hidden rounded-2xl bg-gray-100 aspect-video cursor-pointer"
           @click="open({{ forloop.index0 }})">
        <img src="{{ item.image | relative_url }}" alt="{{ item.alt }}" class="object-cover w-full h-full transition duration-500 group-hover:scale-110">
        <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4">
          <p class="text-white text-sm font-medium">{{ item.caption }}</p>
        </div>
        <div class="absolute top-4 right-4 bg-white/20 backdrop-blur-md p-2 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg>
        </div>
      </div>
      {% endfor %}
    </div>

    <!-- Lightbox Modal -->
    <template x-teleport="body">
      <div x-show="isOpen" 
           x-transition:enter="transition ease-out duration-300"
           x-transition:enter-start="opacity-0"
           x-transition:enter-end="opacity-100"
           x-transition:leave="transition ease-in duration-200"
           x-transition:leave-start="opacity-100"
           x-transition:leave-end="opacity-0"
           @click.self="close()"
           class="fixed inset-0 z-[100] flex items-center justify-center bg-black/95 p-4 md:p-10">
        
        <!-- Close Button -->
        <button @click="close()" class="absolute top-6 right-6 text-white/70 hover:text-white transition-colors z-[110]">
          <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>

        <!-- Navigation Arrows -->
        <button @click="prev()" class="absolute left-4 md:left-8 top-1/2 -translate-y-1/2 text-white/50 hover:text-white transition-colors z-[110]">
          <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <button @click="next()" class="absolute right-4 md:right-8 top-1/2 -translate-y-1/2 text-white/50 hover:text-white transition-colors z-[110]">
          <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </button>

        <!-- Image Container -->
        <div class="relative max-w-5xl w-full h-full flex flex-col items-center justify-center">
          <img :src="images[activeIndex].url" 
               class="max-w-full max-h-[80vh] object-contain shadow-2xl rounded-lg"
               x-transition:enter="transition ease-out duration-300 transform"
               x-transition:enter-start="scale-95 opacity-0"
               x-transition:enter-end="scale-100 opacity-100">
          
          <div class="mt-6 text-center">
            <p class="text-white text-xl font-medium" x-text="images[activeIndex].caption"></p>
            <p class="text-white/40 text-sm mt-2" x-text="`${activeIndex + 1} / ${images.length}`"></p>
          </div>
        </div>
      </div>
    </template>
  </section>
  {% endif %}

  <div class="mt-16 pt-8 border-t border-gray-100">
    <a href="{{ '/' | relative_url }}" class="font-semibold flex items-center gap-2 transition" style="color:#dc2626;">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      Wróć
    </a>
  </div>
</article>
