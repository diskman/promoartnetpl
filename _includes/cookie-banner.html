<div id="cookie-banner" class="cookie-banner" role="dialog" aria-live="polite" aria-label="Cookie consent" hidden>
  <p class="cookie-banner__text">
    Uzywamy cookies analitycznych, aby mierzyc ruch i ulepszac strone.
  </p>
  <div class="cookie-banner__actions">
    <button id="cookie-accept" class="cookie-btn cookie-btn--accept" type="button">Akceptuje</button>
    <button id="cookie-reject" class="cookie-btn cookie-btn--reject" type="button">Odrzucam</button>
  </div>
</div>
