services:
  jekyll:
    build: .
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
      # We create an anonymous volume for node_modules so that the container's 
      # node_modules (Linux) are NOT overwritten by the host's (Windows).
      - /srv/jekyll/node_modules
    environment:
      - JEKYLL_ENV=development
